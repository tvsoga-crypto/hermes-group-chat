        document.querySelectorAll('.btn-edit-room').forEach(btn => {
          btn.onclick = () => {
            showRoomEditModal(parseInt(btn.dataset.id), btn.dataset.name, btn.dataset.desc, btn.dataset.theme);
          };
        });

        document.querySelectorAll('.btn-avatar-room').forEach(btn => {
          btn.onclick = () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = async (e) => {
              const file = e.target.files?.[0];
              if (!file) return;
              const fd = new FormData();
              fd.append('avatar', file);
              try {
                const res = await fetch(`/api/admin/rooms/${btn.dataset.id}/avatar`, {
                  method: 'POST',
                  headers: { 'Authorization': 'Bearer ' + state.token },
                  body: fd,
                });
                const data = await res.json();
                if (data.ok) render.admin(null, __('✅ 頭像已更新'));
                else render.admin(null, '', data.error || __('上傳失敗'));
              } catch {
                render.admin(null, '', __('上傳失敗'));
              }
            };
            input.click();
          };
        });
      });

      document.getElementById('createRoomForm').onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const data = Object.fromEntries(fd);
        const res = await api('/api/admin/rooms', {
          method: 'POST',
          body: JSON.stringify(data),
        });
        if (res.ok) render.admin(null, __('✅ 聊天室已建立'));
        else render.admin(null, '', res.error);
      };
    });
  };

        </form>
      </div>

    overlay.querySelectorAll('.modal-lang-btn').forEach(function(btn) {

        btn.style.background = 'var(--brand)';
        btn.style.color = '#fff';

          </div>
        </form>
      </div>
    `;
    document.body.appendChild(overlay);
    const msgEl = overlay.querySelector('#editRoomMsg');
    document.getElementById('cancelEditRoom').onclick = () => overlay.remove();
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
    document.getElementById('editRoomForm').onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const data = Object.fromEntries(fd);
      const res = await api(`/api/admin/rooms/${id}`, {
        method: 'POST',
        body: JSON.stringify(data),
      });
      if (res.ok) {
        overlay.remove();
        render.admin(null, __('✅ 聊天室已更新'));
      } else {
        msgEl.style.display = 'block';
        msgEl.style.color = 'var(--danger)';
        msgEl.textContent = '❌ ' + (res.error || __('更新失敗'));
      }
    };
  }

  // ─── Socket connection ───
  function connectSocket() {
    if (socket) socket.disconnect();
    socket = io({ auth: { token: state.token } });
  }

  // ─── Bootstrap ───
  const app = document.getElementById('app');
  function setBodyClass(name) {
    document.body.className = name;
  }

  function decodeToken(token) {
    try {
      const payload = JSON.parse(atob(token.split('.')[1]));
      return { id: payload.id, username: payload.username, displayName: payload.displayName, role: payload.role };
    } catch { return null; }
  }

  async function init() {
    const res = await api('/api/check-setup');
    if (res.needsSetup) return render.setup();

    if (state.token) {
      state.user = decodeToken(state.token);
      if (state.user) {
        connectSocket();
        const msgs = await api(`/api/messages?room_id=${state.currentRoomId}`);
        if (msgs.ok) {
          state.messages = msgs.messages;
          state.hasMore = msgs.hasMore;
          return render.chat();
        }
      }
      // Token invalid
      state.token = null;
      state.user = null;
      localStorage.removeItem('haima_token');
    }
    render.login();
  }

  init();
  </script>
</body>
</html>
